name: Publicar paquetes de skills

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/skills_tool.py validate
      - run: python3 scripts/skills_tool.py package
      - name: Comprimir paquete para Proyectos de ChatGPT
        run: cd dist && zip -qr chatgpt-proyecto.zip chatgpt-proyecto
      - name: Crear release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agentic-marketing-os-skills.zip
            dist/chatgpt-proyecto.zip
            dist/skills/*.zip
      - name: Guardar artefactos (ejecución manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: skills
          path: dist/
